name: Build Android APK for Ava

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Game
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} ./AvaGame-v1.0.1.apk \;
          ls -la AvaGame-v1.0.1.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AvaGame-v1.0.1-APK
          path: ./AvaGame-v1.0.1.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: "🌸 بازی دنیای شگفت‌انگیز آوا v1.0.1 (حل قطعی مشکل صفحه سفید تبلت)"
          body: |
            ## 🌸 بازی آموزشی «دنیای شگفت‌انگیز آوا» v1.0.1
            ویژه تبلت‌های ۷ اینچی و اندروید ۵ به بالا (Android 5.0 Lollipop+)

            ### ✨ تغییرات مهم در این نسخه:
            - **حل قطعی مشکل صفحه سفید تبلت:** تبدیل تمامی کدهای بازی به جاوااسکریپت خالص ES5 سازگار با نسخه قدیمی WebView اندروید ۵.
            - حذف تگ‌های module و SystemJS که در مرورگرهای قدیمی اندروید باعث مسدود شدن اجرای برنامه می‌شدند.
            - اجرای مستقل آفلاین بدون نیاز به اتصال اینترنت.

            ### 📱 دانلود فایل نصبی:
            فایل **`AvaGame-v1.0.1.apk`** را دانلود کرده و مستقیماً روی تبلت نصب کنید.
          files: ./AvaGame-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK for Ava

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Game
        run: |
          npm install
          npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: |
          cd android
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} ./AvaGame-v1.0.2.apk \;
          ls -la AvaGame-v1.0.2.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AvaGame-v1.0.2-APK
          path: ./AvaGame-v1.0.2.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.2
          name: "🌸 بازی دنیای شگفت‌انگیز آوا v1.0.2 (نسخه فوق‌العاده سازگار با اندروید ۵ و حل کامل صفحه سفید)"
          body: |
            ## 🌸 بازی آموزشی «دنیای شگفت‌انگیز آوا» v1.0.2
            ویژه تبلت‌های ۷ اینچی و اندروید ۵ به بالا (Android 5.0 Lollipop+)

            ### ✨ تغییرات مهم و حیاتی در نسخه v1.0.2:
            - **حل قطعی و نهایی صفحه سفید:**
              ۱. اضافه شدن پلی‌فیل‌های کامل برای مرورگرهای قدیمی اندروید ۵ (شامل NodeList.forEach، Array.find، startsWith، includes و غیره).
              ۲. حل مشکل امنیتی localStorage در حالت فایل با ایجاد حافظه داخلی موازی (In-memory fallback).
              ۳. حذف حالت شتاب‌سخت‌افزاری تکراری لایه WebView که باعث قفل شدن کارت‌های گرافیک ضعیف تبلت می‌شد.
              ۴. پشتیبانی کامل از رویدادهای لمسی واقعی (touchstart/touchmove) به جای Pointer Events.
              ۵. استفاده از لودر اختصاصی WebViewAssetLoader و فال‌بک خودکار به file scheme.
            - اجرای ۱۰۰٪ آفلاین و پرسرعت.

            ### 📱 راهنمای نصب روی تبلت:
            ۱. لطفاً نسخه قبلی را از روی تبلت لغو نصب (Uninstall) کنید.
            ۲. فایل **`AvaGame-v1.0.2.apk`** را دانلود کرده و نصب کنید.
          files: ./AvaGame-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
